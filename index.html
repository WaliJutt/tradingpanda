<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Panda - Signals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🐼 Trading Panda Signals</h1>
    <button id="logout-btn" class="hidden">Logout</button>
  </header>

  <main>
    <div id="auth-section" class="card">
      <h2>Welcome Back</h2>
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <div class="btn-group">
        <button id="login-btn">Login</button>
        <button id="signup-btn" class="secondary">Sign Up</button>
      </div>
    </div>

    <div id="main-app" class="hidden">
      <div id="admin-panel" class="card hidden">
        <h3>Post New Signal (Admin)</h3>
        <form id="signal-form">
          <input type="text" id="pair" placeholder="Pair (e.g. XAU/USD)" required>
          <select id="action">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
          <input type="text" id="entry" placeholder="Entry Price" required>
          <input type="text" id="sl" placeholder="Stop Loss (SL)" required>
          <input type="text" id="tp" placeholder="Take Profit (TP)" required>
          <button type="submit">Post Signal</button>
        </form>
      </div>

      <h2>Live Signals Feed</h2>
      <div id="signals-container"></div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>

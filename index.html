<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading VIP Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col justify-between z-20">
        <div>
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-xl font-bold text-purple-400">Menu Options</h1>
                <button id="close-menu" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <nav class="space-y-4">
                <a href="#" class="block py-2.5 px-4 rounded bg-purple-800/40 text-purple-300 font-medium">Dashboard / Overview</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-400">TradingView Live Chart</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-400">Gold Accuracy & Win Rate</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-400">Forex Pairs Analytics</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-400">Gold & Forex Lot Calculator</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-400">Profile Settings</a>
            </nav>
        </div>
        <div>
            <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
                👑 Upgrade Your Plan (VIP)
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 overflow-y-auto">
        <!-- Top Price Ticker -->
        <header class="flex items-center justify-between mb-6 bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div class="flex items-center gap-6 text-sm font-semibold">
                <div>XAU/USD <span class="text-green-400">$2,738.50 ▲ +0.45%</span></div>
                <div>EUR/USD <span class="text-red-400">$1.0820 ▼ -0.12%</span></div>
                <div>BTC/USD <span class="text-green-400">$68,450.00 ▲ +2.10%</span></div>
            </div>
            <div class="bg-purple-600 px-3 py-1 rounded text-xs font-bold uppercase tracking-wider">
                Admin VIP
            </div>
        </header>

        <!-- Admin Control & Signal Section -->
        <section class="max-w-4xl mx-auto space-y-6">
            <h2 class="text-2xl font-bold border-b border-slate-800 pb-2">Signal Control Panel (Admin)</h2>

            <!-- Current Signal Status Display -->
            <div id="active-signal-container" class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <!-- Javascript will dynamically inject Active Signal or No Signal state -->
            </div>

            <!-- Publish Signal Form -->
            <form id="signal-form" class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
                <h3 class="text-lg font-semibold text-purple-400">Publish New Signal</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Select Pair</label>
                        <select id="signal-pair" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500">
                            <option value="XAU/USD">XAU/USD (Gold)</option>
                            <option value="EUR/USD">EUR/USD</option>
                            <option value="BTC/USD">BTC/USD</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Trade Type</label>
                        <select id="signal-type" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500">
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Entry Price</label>
                        <input type="text" id="signal-entry" placeholder="2738.50" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Take Profit (TP)</label>
                        <input type="text" id="signal-tp" placeholder="2750.00" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Stop Loss (SL)</label>
                        <input type="text" id="signal-sl" placeholder="2725.00" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2">
                    ✈️ Publish Signal
                </button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

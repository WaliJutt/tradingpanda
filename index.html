<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Panda - Signal Feed</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0813] text-white min-h-screen">

    <!-- Top Header Navigation -->
    <header class="flex flex-wrap items-center justify-between p-4 bg-[#120b22] border-b border-purple-900/30 gap-4">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                🐼 TRADING <span class="text-purple-400">PANDA</span>
            </h1>
        </div>

        <div class="hidden md:flex items-center gap-6 text-xs font-semibold">
            <div>XAU/USD <span class="text-emerald-400">$2,738.50 ▲ +0.45%</span></div>
            <div>EUR/USD <span class="text-rose-500">$1.0820 ▼ -0.12%</span></div>
            <div>BTC/USD <span class="text-emerald-400">$68,450.00 ▲ +2.10%</span></div>
        </div>

        <!-- Role Selector Switcher (Testing & Access Control) -->
        <div class="flex items-center gap-2">
            <label class="text-xs text-gray-400">View As:</label>
            <select id="role-selector" class="bg-[#1c1335] text-purple-300 text-xs font-bold border border-purple-900/50 rounded px-2 py-1 focus:outline-none">
                <option value="FREE">Free Member</option>
                <option value="VIP">VIP Member</option>
                <option value="ADMIN">Admin Panel</option>
            </select>
        </div>
    </header>

    <div class="max-w-5xl mx-auto p-6 space-y-8">
        
        <!-- Live Signal Feed Section -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <span class="text-purple-400">📡</span> Live Signal Feed
                </h2>
                <div class="flex items-center gap-2">
                    <span id="user-status-badge" class="text-xs bg-purple-500/20 text-purple-300 px-2.5 py-1 rounded-full font-semibold border border-purple-500/30">
                        Free Access
                    </span>
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-semibold border border-emerald-500/30">
                        ● LIVE
                    </span>
                </div>
            </div>

            <!-- Signal Feed Render Container -->
            <div id="signals-feed-list" class="space-y-4">
                <!-- Javascript dynamically renders signals -->
            </div>
        </section>

        <!-- Admin Publish Signal Form (Hidden for non-admins) -->
        <section id="admin-publish-section" class="bg-[#130d24] p-6 rounded-xl border border-purple-900/30 shadow-lg hidden">
            <h3 class="text-md font-bold text-purple-300 mb-4">➕ Admin: Publish New Signal</h3>
            <form id="signal-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Symbol</label>
                        <input type="text" id="signal-pair" value="XAUUSD" class="w-full bg-[#1c1335] border border-purple-900/40 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Type</label>
                        <select id="signal-type" class="w-full bg-[#1c1335] border border-purple-900/40 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500">
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Entry Price</label>
                        <input type="number" step="any" id="signal-entry" placeholder="2738.50" class="w-full bg-[#1c1335] border border-purple-900/40 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Stop Loss (SL)</label>
                        <input type="number" step="any" id="signal-sl" placeholder="2725.00" class="w-full bg-[#1c1335] border border-purple-900/40 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Take Profit (TP)</label>
                        <input type="number" step="any" id="signal-tp" placeholder="2750.00" class="w-full bg-[#1c1335] border border-purple-900/40 rounded p-2.5 text-sm focus:outline-none focus:border-purple-500" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-bold text-sm transition">
                    🚀 Publish Signal
                </button>
            </form>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
